AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: portfolio-cloud serverless automation stack

Parameters:
  StageName:
    Type: String
    Default: dev
    AllowedPattern: "[a-z0-9-]+"
  AllowedOrigin:
    Type: String
    Default: https://matiasgaleano.dev
  R2Endpoint:
    Type: String
    Default: https://20804625e19c3ff733141d1fa4aa202a.r2.cloudflarestorage.com
  R2Region:
    Type: String
    Default: auto
  R2Bucket:
    Type: String
    Default: portoflio-blog-media
  R2AccessKeyId:
    Type: String
    NoEcho: true
  R2SecretAccessKey:
    Type: String
    NoEcho: true
  OgObjectPrefix:
    Type: String
    Default: og
  MediaBaseUrl:
    Type: String
    Default: https://media.matiasgaleano.dev
  BlogFromEmail:
    Type: String
    Default: blog@matiasgaleano.dev
  ResendApiKey:
    Type: String
    NoEcho: true

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    MemorySize: 512
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        R2_ENDPOINT: !Ref R2Endpoint
        R2_REGION: !Ref R2Region
        R2_BUCKET: !Ref R2Bucket
        R2_ACCESS_KEY_ID: !Ref R2AccessKeyId
        R2_SECRET_ACCESS_KEY: !Ref R2SecretAccessKey
        OG_OBJECT_PREFIX: !Ref OgObjectPrefix
        MEDIA_BASE_URL: !Ref MediaBaseUrl
        BLOG_FROM_EMAIL: !Ref BlogFromEmail
        RESEND_API_KEY: !Ref ResendApiKey

Resources:
  PortfolioCloudHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - content-type
        AllowMethods:
          - POST
          - DELETE

  SubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub portfolio-cloud-${StageName}-subscribe
      CodeUri: .
      Handler: src/lambdas/subscribe/handler.handler
      Description: Public subscription endpoint for the portfolio blog.
      Events:
        SubscribeApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortfolioCloudHttpApi
            Path: /subscriptions
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambdas/subscribe/handler.ts
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        OutExtension:
          - .js=.js

  UnsubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub portfolio-cloud-${StageName}-unsubscribe
      CodeUri: .
      Handler: src/lambdas/unsubscribe/handler.handler
      Description: Public unsubscribe endpoint for the portfolio blog.
      Events:
        UnsubscribeApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortfolioCloudHttpApi
            Path: /subscriptions
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambdas/unsubscribe/handler.ts
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        OutExtension:
          - .js=.js

  GenerateOgFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub portfolio-cloud-${StageName}-generate-og
      CodeUri: .
      Handler: src/lambdas/generate-og/handler.handler
      Description: Generates Open Graph images for published portfolio content.
      Timeout: 30
      MemorySize: 1024
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        UseNpmCi: true
        EntryPoints:
          - src/lambdas/generate-og/handler.ts
        External:
          - "@resvg/resvg-js"
          - "@resvg/resvg-js/*"
          - "@resvg/*"
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        OutExtension:
          - .js=.js

  NotifyPostFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub portfolio-cloud-${StageName}-notify-post
      CodeUri: .
      Handler: src/lambdas/notify-post/handler.handler
      Description: Sends publication notifications for newly released posts.
      Timeout: 30
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambdas/notify-post/handler.ts
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        OutExtension:
          - .js=.js

  ProcessReleaseFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub portfolio-cloud-${StageName}-process-release
      CodeUri: .
      Handler: src/lambdas/process-release/handler.handler
      Description: Processes release manifests generated by the portfolio deploy.
      Timeout: 30
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambdas/process-release/handler.ts
        Minify: true
        Sourcemap: true
        Target: es2022
        Format: cjs
        OutExtension:
          - .js=.js

Outputs:
  HttpApiUrl:
    Description: Base URL for the public subscription API.
    Value: !Sub https://${PortfolioCloudHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  SubscribeFunctionName:
    Description: Deployed Lambda function name for subscribe.
    Value: !Ref SubscribeFunction
  UnsubscribeFunctionName:
    Description: Deployed Lambda function name for unsubscribe.
    Value: !Ref UnsubscribeFunction
  GenerateOgFunctionName:
    Description: Deployed Lambda function name for OG generation.
    Value: !Ref GenerateOgFunction
  NotifyPostFunctionName:
    Description: Deployed Lambda function name for post notifications.
    Value: !Ref NotifyPostFunction
  ProcessReleaseFunctionName:
    Description: Deployed Lambda function name for release processing.
    Value: !Ref ProcessReleaseFunction
